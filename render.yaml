databases:
  - name: kavach-postgres
    plan: free
    databaseName: kavach
    user: kavach_user

services:
  # ---------------------------------------------------------------------------
  # 1. Kavach Backend Web Service (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: kavach-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: kavach-postgres
          property: connectionString
      - key: SQL_DATABASE_URL
        fromDatabase:
          name: kavach-postgres
          property: connectionString
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://kavachsecurity.me,https://www.kavachsecurity.me,https://*.onrender.com"

  # ---------------------------------------------------------------------------
  # 2. Kavach Frontend Web Service (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: kavach-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build:clean
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_APP_URL
        value: https://kavachsecurity.me
      - key: BACKEND_URL
        fromService:
          type: web
          name: kavach-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: kavach-backend
          property: host
