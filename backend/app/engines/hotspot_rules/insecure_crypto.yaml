id: insecure-crypto
title: Insecure Cryptographic Usage
severity: high
risk_level: High
category: Cryptography
cwe: CWE-327
owasp: A02:2021-Cryptographic Failures
cvss_score: "7.5 (High)"
patterns:
  - "crypto.createCipher("
  - "crypto.createHash('md5')"
  - "crypto.createHash('sha1')"
  - "crypto.createHash(\"md5\")"
  - "crypto.createHash(\"sha1\")"
  - "hashlib.md5("
  - "hashlib.sha1("
  - "DES.new("
  - "RC4.new("
description: "Use of broken, weak, or deprecated cryptographic algorithms (MD5, SHA1, DES, RC4) susceptible to collision attacks and cryptanalysis."
remediation: "Upgrade to strong standard cryptographic functions: SHA-256 / SHA-3 for hashing and HMAC, and AES-256-GCM or ChaCha20-Poly1305 for symmetric encryption."
references:
  - title: "OWASP Cryptographic Failures"
    url: "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
  - title: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    url: "https://cwe.mitre.org/data/definitions/327.html"
