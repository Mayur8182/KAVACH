id: hardcoded-credentials
title: Hardcoded Sensitive Credentials
severity: critical
risk_level: Critical
category: Data Exposure
cwe: CWE-798
owasp: A07:2021-Identification and Authentication Failures
cvss_score: "8.9 (Critical)"
patterns:
  - "api_key"
  - "secret_key"
  - "app_secret"
  - "private_key"
  - "auth_token"
  - "stripe_sk"
  - "aws_secret_access_key"
description: "Plaintext secrets, private keys, or credentials embedded directly into source code."
remediation: "Extract secrets to external environment variables or an enterprise secrets manager (AWS Secrets Manager, HashiCorp Vault)."
references:
  - title: "OWASP Credentials Management"
    url: "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password"
  - title: "CWE-798: Use of Hard-coded Credentials"
    url: "https://cwe.mitre.org/data/definitions/798.html"
